<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Aury Shop — Asistente ML</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Aury Shop" />
  <meta name="theme-color" content="#534AB7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #534AB7; --purple-light: #EEEDFE; --purple-dark: #3C3489;
      --green: #1D9E75; --bg: #F6F5FF; --white: #ffffff;
      --text: #1a1a2e; --text-muted: #6b6b8a; --border: rgba(83,74,183,0.15);
    }
    html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); -webkit-font-smoothing: antialiased; }
    .app { display: flex; flex-direction: column; height: 100dvh; max-width: 480px; margin: 0 auto; background: var(--white); }
    .header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .hav { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
    .hav img { width: 100%; height: 100%; object-fit: cover; }
    .hinfo { flex: 1; }
    .hname { font-size: 15px; font-weight: 600; color: var(--text); }
    .hstatus { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; margin-top: 1px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .messages { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
    .msg-row { display: flex; gap: 8px; align-items: flex-end; animation: fadeUp 0.2s ease; }
    .msg-row.user { flex-direction: row-reverse; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .mav { width: 30px; height: 30px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
    .mav img { width: 100%; height: 100%; object-fit: cover; }
    .mbody { display: flex; flex-direction: column; max-width: 80%; }
    .msg-row.user .mbody { align-items: flex-end; }
    .bubble { padding: 11px 15px; border-radius: 18px; font-size: 14.5px; line-height: 1.6; word-break: break-word; }
    .bubble.bot { background: var(--white); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
    .bubble.user { background: var(--purple); color: #fff; border-bottom-right-radius: 4px; }
    .copy-btn { display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; padding: 4px 11px; font-size: 12px; font-family: inherit; color: var(--purple); background: var(--purple-light); border: none; border-radius: 20px; cursor: pointer; }
    .copy-btn:active { opacity: 0.7; }
    .chips-wrap { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; flex-shrink: 0; }
    .chip { padding: 7px 13px; font-size: 13px; font-family: inherit; background: var(--white); color: var(--purple); border: 1px solid var(--purple); border-radius: 20px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .chip:active { background: var(--purple-light); }
    .typing-dots { display: flex; gap: 4px; align-items: center; padding: 13px 15px; }
    .typing-dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); animation: blink 1.2s infinite; }
    .typing-dots span:nth-child(2){animation-delay:.2s}.typing-dots span:nth-child(3){animation-delay:.4s}
    @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
    .input-area { display: flex; gap: 8px; align-items: center; padding: 10px 14px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--white); flex-shrink: 0; }
    .input-area input { flex: 1; padding: 11px 16px; font-size: 15px; font-family: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 24px; color: var(--text); outline: none; -webkit-appearance: none; }
    .input-area input:focus { border-color: var(--purple); }
    .input-area input::placeholder { color: var(--text-muted); }
    .send-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--purple); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; -webkit-tap-highlight-color: transparent; }
    .send-btn:active { background: var(--purple-dark); transform: scale(0.95); }
    .err { background: #FCEBEB; color: #A32D2D; border-radius: 12px; padding: 8px 12px; font-size: 13px; }
  </style>
</head>

function addErr(msg) {
  const c = document.getElementById('msgs');
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.innerHTML = `<div class="mav">🛍️</div><div class="mbody"><div class="err">${msg}</div></div>`;
  c.appendChild(row);
  c.scrollTop = c.scrollHeight;
}

function cp(id, text) {
  navigator.clipboard.writeText(text).then(() => {
    const b = document.getElementById(id);
    if (b) { b.textContent = '✅ ¡Copiado!'; setTimeout(() => b.textContent = '📋 Copiar', 1800); }
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    const b = document.getElementById(id);
    if (b) { b.textContent = '✅ ¡Copiado!'; setTimeout(() => b.textContent = '📋 Copiar', 1800); }
  });
}

function removeTyping() { const e = document.getElementById('typ'); if (e) e.remove(); }

async function send() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  const ch = document.getElementById('chips');
  if (ch) ch.style.display = 'none';
  addMsg('user', text, false);
  history.push({ role: 'user', content: text });
  showTyping();
  try {
    const res = await fetch(API + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    if (!res.ok) throw new Error('Error ' + res.status);
    const data = await res.json();
    removeTyping();
    addMsg('bot', data.reply, true);
    history.push({ role: 'assistant', content: data.reply });
  } catch(e) {
    removeTyping();
    addErr('Sin conexión al servidor. Intenta de nuevo.');
  }
}

function ask(btn) {
  document.getElementById('inp').value = btn.textContent.trim();
  send();
}

document.getElementById('inp').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

window.addEventListener('DOMContentLoaded', () => {

});
